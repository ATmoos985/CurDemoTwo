services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cutdemo
      MYSQL_USER: cutdemo
      MYSQL_PASSWORD: ${CUTDEMO_DB_PASSWORD:?Set CUTDEMO_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--default-storage-engine=InnoDB"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -N -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_ADDRESS: 0.0.0.0
      CUTDEMO_DB_URL: jdbc:mysql://mysql:3306/cutdemo?characterEncoding=UTF-8&connectionTimeZone=Asia/Taipei
      CUTDEMO_DB_USER: cutdemo
      CUTDEMO_DB_PASSWORD: ${CUTDEMO_DB_PASSWORD}
      PACKINGSOLVER_PATH: /opt/solver/packingsolver_rectangleguillotine
    ports:
      - "127.0.0.1:${CUTDEMO_HTTP_PORT:-8080}:8080"
volumes:
  mysql-data:
