<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搭切系统 · UI 原型 v1</title>
<style>
:root{
  --bg:#eef0f3; --panel:#fff; --panel-2:#f7f8fa; --line:#d8dce2; --line-2:#e7e9ed;
  --text:#1d2329; --text-2:#4b5560; --text-3:#7d8791;
  --accent:#2c6aa8; --accent-2:#e8f0f8; --accent-ink:#1f4f80;
  --ok:#2f8a57; --ok-bg:#e6f3ec; --warn:#b7791f; --warn-bg:#fbf1df; --err:#c0392b; --err-bg:#f9e5e2; --run:#2c6aa8; --run-bg:#e8f0f8; --idle:#6b7580; --idle-bg:#eceef1;
  --bar:#1f2429; --bar-2:#2a3036; --bar-text:#c9d0d7;
  --canvas:#2a2f35; --canvas-grid:#343a41;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --row:28px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.r{text-align:right}

/* app frame */
.app{display:grid;grid-template-rows:36px 1fr 24px;grid-template-columns:184px 1fr;height:100vh}
.topbar{grid-column:1/3;background:var(--bar);color:var(--bar-text);display:flex;align-items:center;padding:0 12px;gap:16px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;letter-spacing:.5px;width:160px}
.brand i{width:16px;height:16px;border:2px solid #8fb3d9;display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;left:4px;top:-2px;bottom:-2px;border-left:2px solid #8fb3d9}
.topbar .search{flex:0 0 320px;background:var(--bar-2);border:1px solid #39414a;border-radius:2px;height:24px;padding:0 8px;color:var(--bar-text)}
.topbar .sp{flex:1}
.topbar .meta{display:flex;gap:14px;font-size:12px}
.topbar .meta b{color:#fff;font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.nav{background:var(--panel-2);border-right:1px solid var(--line);padding:8px 0;overflow:auto}
.nav h6{margin:12px 14px 4px;font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:1px}
.nav a{display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;color:var(--text-2);text-decoration:none;border-left:3px solid transparent}
.nav a:hover{background:#eceff3}
.nav a.on{background:#e3e9f0;color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--text-3)}
.nav .ico{width:14px;height:14px;opacity:.7}
.main{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.statusbar{grid-column:1/3;background:var(--panel-2);border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 12px;font-size:11.5px;color:var(--text-2)}
.statusbar .sp{flex:1}

/* page header */
.ph{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ph h1{font-size:15px;margin:0;font-weight:600}
.ph .crumb{color:var(--text-3);font-size:12px}
.ph .sp{flex:1}
.btn{height:26px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:2px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b8bfc8;background:#fafbfc}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.pri:hover{background:#255d94}
.btn.sm{height:22px;padding:0 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eceff3}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line-2);flex:none}
.field{height:26px;border:1px solid var(--line);border-radius:2px;padding:0 8px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;background:#fff;height:24px;padding:0 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-2);color:var(--accent-ink);font-weight:600}
.body{flex:1;overflow:auto;padding:12px 16px}

/* table */
table.t{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
.t th{height:30px;background:var(--panel-2);color:var(--text-2);font-weight:500;font-size:12px;text-align:left;padding:0 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.t td{height:var(--row);padding:0 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.t tr:hover td{background:#f5f8fb}
.t tr.sel td{background:#e8f0f8}
.t td.link{color:var(--accent);cursor:pointer}
.t td.link:hover{text-decoration:underline}
.tag{display:inline-block;height:18px;line-height:18px;padding:0 6px;font-size:11.5px;border-radius:2px;background:var(--idle-bg);color:var(--idle)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)} .tag.run{background:var(--run-bg);color:var(--run)}
.tag.kind{background:#fff;border:1px solid var(--line);color:var(--text-2)}
.bar{display:inline-block;width:64px;height:6px;background:var(--line-2);vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;color:var(--text-3);font-size:12px;padding:8px 2px}

/* split layouts */
.split{flex:1;display:grid;min-height:0}
.pane{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane:last-child{border-right:0}
.pane-h{height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:12.5px;flex:none}
.pane-h .sp{flex:1}
.pane-h .sub{color:var(--text-3);font-weight:400}
.pane-b{flex:1;overflow:auto;min-height:0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:0;font-size:12.5px}
.kv div{padding:5px 12px;border-bottom:1px solid var(--line-2)}
.kv div:nth-child(odd){color:var(--text-3)}
.sec{padding:8px 12px 4px;font-size:11px;letter-spacing:1px;color:var(--text-3);background:var(--panel-2);border-bottom:1px solid var(--line-2);border-top:1px solid var(--line-2)}
.metric{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line-2)}
.metric div{padding:8px 12px;border-right:1px solid var(--line-2)}
.metric div:nth-child(2n){border-right:0}
.metric div:nth-child(n+3){border-top:1px solid var(--line-2)}
.metric small{display:block;color:var(--text-3);font-size:11.5px}
.metric b{font:600 17px var(--mono)}
.metric b em{font-style:normal;font-size:11px;color:var(--text-3);font-weight:400;margin-left:2px}

/* workbench */
.wb-head{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.wb-head h1{font-size:14px;margin:0}
.stages{display:flex;height:34px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;flex:none}
.stage{display:flex;align-items:center;gap:7px;padding:0 16px 0 0;margin-right:16px;color:var(--text-3);cursor:pointer;position:relative;border-bottom:2px solid transparent}
.stage .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px}
.stage.done{color:var(--text-2)} .stage.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stage.on{color:var(--accent-ink);font-weight:600;border-bottom-color:var(--accent)} .stage.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
.stage:not(:last-child):after{content:"";width:24px;height:1px;background:var(--line);margin-left:16px}
.ctool{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:2px;height:32px;padding:0 8px;background:#33393f;border-bottom:1px solid #20252a;flex:none}
.ctool button{flex:none;height:24px;min-width:26px;padding:0 7px;background:transparent;border:1px solid transparent;color:#c9d0d7;border-radius:2px;cursor:pointer;font-size:12px}
.ctool button:hover{background:#3e454c}
.ctool button.on{background:#47505a;border-color:#56606b;color:#fff}
.ctool .div{width:1px;height:16px;background:#4a525b;margin:0 6px}
.ctool .sp{flex:1}
.ctool span{flex:none;color:#9aa4ae;font-size:11.5px}
.canvas-wrap{flex:1;position:relative;background:var(--canvas);min-height:0;overflow:hidden}
.canvas-wrap svg{width:100%;height:100%;display:block}
.strip{height:112px;flex:none;background:#23272c;border-top:1px solid #1a1d21;display:flex;gap:8px;padding:8px;overflow-x:auto}
.thumb{flex:none;width:148px;background:#2e343a;border:1px solid #3b434b;border-radius:2px;cursor:pointer;display:flex;flex-direction:column}
.thumb.on{border-color:#6ea3d8;box-shadow:0 0 0 1px #6ea3d8}
.thumb svg{flex:1}
.thumb .cap{display:flex;justify-content:space-between;font-size:11px;color:#aeb7c0;padding:3px 6px;border-top:1px solid #3b434b}
.thumb .cap b{color:#fff;font-family:var(--mono);font-weight:500}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;background:rgba(30,34,39,.85);padding:4px 8px;border-radius:2px;font-size:11px;color:#c9d0d7}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.wb-foot{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel-2);flex:none}
.wb-foot .sp{flex:1}

/* misc */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.card small{color:var(--text-3);font-size:12px}
.card b{display:block;font:600 22px var(--mono);margin-top:2px}
.card .d{font-size:11.5px;color:var(--text-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--panel);border:1px solid var(--line)}
.box .pane-h{border-bottom:1px solid var(--line-2)}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.form{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;padding:12px;align-items:center}
.form label{color:var(--text-2);font-size:12.5px}
.notice{margin:0 0 12px;padding:8px 12px;border:1px solid #c9d8e8;background:#f2f6fb;color:var(--accent-ink);font-size:12.5px}
.proto{position:fixed;left:10px;bottom:30px;background:#fff3cd;border:1px solid #e3c26a;color:#7a5a00;font-size:11.5px;padding:3px 8px;border-radius:2px;z-index:9}
.strip{display:none}
.vsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.vtrack{position:relative;flex:1;width:16px;background:#3a4148;border:1px solid #56606b;cursor:pointer;margin:0 auto}
.vtrack b{position:absolute;left:0;right:0;top:0;background:rgba(76,195,138,.25)}
.vtrack em{position:absolute;left:-6px;right:-6px;height:2px;background:#4cc38a}
.vtrack i{position:absolute;left:0;right:0;height:2px;background:#c0392b}
.vtrack i.new{background:#ff9f43}
.ctool button[disabled]{opacity:.4;cursor:default}
.stages{align-items:stretch}
.stage{white-space:nowrap;flex:none;margin-right:10px!important}
.stage:not(:last-child):after{width:14px!important;margin-left:10px!important}
.sum{position:relative;display:flex;align-items:center;gap:6px}
.sumb{height:26px;border:1px solid var(--line);background:#fff;border-radius:2px;padding:0 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.sumb small{color:var(--text-3);margin-right:6px;font-size:11.5px}
.sumb:hover{border-color:#b8bfc8}
.sumb.on{border-color:var(--accent);background:var(--accent-2)}
.sumb.warn{border-color:#e3c26a;background:var(--warn-bg)}
.popover{position:absolute;right:0;top:32px;width:420px;max-height:460px;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(20,30,40,.18);z-index:20}
.vseg{flex:none;display:inline-flex;border:1px solid #56606b;border-radius:2px;overflow:hidden}
.vseg button{border:0!important;border-radius:0!important;height:22px!important}
.vseg button.on{background:#5a7fa6!important;color:#fff}
.cin{flex:none;width:62px;height:22px;background:#23282d;border:1px solid #56606b;color:#fff;border-radius:2px;padding:0 6px;text-align:right;margin:0 4px}
.navroll{flex:none;background:#23272c;border-top:1px solid #1a1d21;padding:6px 12px 8px;color:#aeb7c0;font-size:11.5px}
.nr-head{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.nr-head b{color:#e6ebef;font-weight:500}
.nr-track{position:relative;height:22px;background:#2e343a;border:1px solid #3b434b;margin-bottom:16px}
.tb{position:absolute;top:0;bottom:0;border-right:1px solid #1d2125;cursor:pointer}
.tb.used{background:repeating-linear-gradient(45deg,#2b3036 0 3px,#454c54 3px 5px);cursor:default}
.tb.skip{background:repeating-linear-gradient(-45deg,#3a2a2a 0 3px,#a04a40 3px 4px);cursor:default}
.tb.tail{border:1px dashed #8a949e;cursor:default}
.tb.seg:hover{filter:brightness(1.25)}
.tb.cut{filter:saturate(.2) brightness(.75);background-image:linear-gradient(transparent 40%,rgba(255,255,255,.08) 40% 60%,transparent 60%)!important}
.twin{position:absolute;top:-4px;bottom:-4px;border:2px solid #7fb3e6;background:rgba(127,179,230,.22);cursor:grab;z-index:4;min-width:6px}
.twin.ro{border-style:dashed;cursor:default}
.twin:active{cursor:grabbing}
.twl{position:absolute;bottom:100%;left:-2px;margin-bottom:3px;white-space:nowrap;font:11px var(--mono);color:#cfe3f7;background:#23272c;padding:0 4px}
.twh{position:absolute;right:-7px;top:-2px;bottom:-2px;width:10px;background:#7fb3e6;color:#1d2125;font-size:8px;display:grid;place-items:center;cursor:ew-resize;border-radius:1px}
.nr-head{margin-bottom:20px!important}
.tdef{position:absolute;top:-4px;bottom:-4px;width:2px;background:#ff6b5b;z-index:3}
.ttick{position:absolute;top:24px;transform:translateX(-50%);font:10px var(--mono);color:#7d8791}
.ttick:first-child{transform:none}
.nr-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:20px;padding:0 7px;background:#2e343a;border:1px solid #3b434b;color:#c9d0d7;border-radius:2px;font-size:11px;cursor:pointer}
.chip:hover{border-color:#6ea3d8}
.chip i{display:inline-block;width:8px;height:8px;margin-right:5px}
.chip b{color:#fff;font-weight:500;font-family:var(--mono)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><i></i>搭切 CutPlan</div>
    <input class="search" placeholder="搜索任务号 / 卷号 / 订单号   ⌘K">
    <div class="sp"></div>
    <div class="meta">
      <span><span class="dot" style="background:#4cc38a"></span>求解引擎 <b>就绪</b></span>
      <span>车间 <b>一车间</b></span>
      <span>班次 <b>白班</b></span>

    </div>
  </header>

  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>

  <footer class="statusbar" id="statusbar"></footer>
</div>
<div class="proto">UI 原型 v1 · 示例数据</div>

<script>
/* ---------------- 原型数据（仅原型使用） ---------------- */
const ORDER_COLORS={A:'#5f87b0',B:'#7f9d6e',C:'#b8925a',D:'#9a7aa0',E:'#5f9a96',F:'#a8735f'};
const TASKS=[
  {id:'CT-20261027-012',name:'窗帘 10 月第 4 批',kind:'二维·矩形',mat:'遮光布 280',orders:6,dem:420,done:0,st:['待排料','idle'],next:'排料',due:'10-29'},
  {id:'CT-20261027-011',name:'无纺布分条 B 线',kind:'一维·分条',mat:'无纺布 2400',orders:9,dem:96,done:0,st:['计算中','run'],next:'查看进度',due:'10-28'},
  {id:'CT-20261027-009',name:'服装款 S26-118 齐套',kind:'二维·异形',mat:'弹力牛津 150',orders:3,dem:180,done:0,st:['待执行','run'],next:'下达',due:'10-30'},
  {id:'CT-20261026-021',name:'卷帘 定高定宽',kind:'二维·矩形',mat:'阳光面料 300',orders:4,dem:120,done:84,st:['执行中','run'],next:'报工',due:'10-27'},

];
const ROLLS=[
  {id:'R-2610-0920',mat:'遮光布 280',w:2800,len:55,full:60,loc:'A-01-03',q:['合格','ok'],res:'—',src:'采购 PO-8812'},
  {id:'R-2610-0921',mat:'遮光布 280',w:2800,len:48,full:60,loc:'A-02-01',q:['合格','ok'],res:'CT-…-012',src:'采购 PO-8812'},
  {id:'R-2610-0933',mat:'无纺布 2400',w:2400,len:800,full:1000,loc:'B-03-02',q:['合格','ok'],res:'CT-…-011',src:'采购 PO-8830'},
  {id:'R-2610-0934',mat:'无纺布 2400',w:2400,len:1000,full:1000,loc:'B-03-03',q:['待检','warn'],res:'—',src:'采购 PO-8830'},
  {id:'R-2610-0941',mat:'弹力牛津 150',w:1500,len:120,full:120,loc:'C-01-01',q:['有疵点','warn'],res:'CT-…-009',src:'采购 PO-8841'},
  {id:'R-2610-0950',mat:'PE 膜 1800',w:1800,len:0,full:2000,loc:'D-01-01',q:['已耗尽','idle'],res:'—',src:'采购 PO-8850'},
  {id:'RM-2610-0117',mat:'遮光布 280',w:1260,len:3.4,full:3.4,loc:'料头架 2',q:['合格','ok'],res:'—',src:'CT-…-014 产出',rem:true},
  {id:'RM-2610-0118',mat:'阳光面料 300',w:900,len:2.1,full:2.1,loc:'料头架 2',q:['隔离','err'],res:'—',src:'复检转料头',rem:true},
];

/* 排法：长度方向 = x（沿进料方向），幅宽方向 = y。二维每个排法的拉布长度不同。 */
function shelfLayout(W,H,items){
  const out=[];let x=0,y=0,rowH=0;
  for(const it of items){for(let k=0;k<it.n;k++){
    if(x+it.w>W){x=0;y+=rowH;rowH=0}
    if(y+it.h>H)return out;
    out.push({x,y,w:it.w,h:it.h,o:it.o,label:it.o+'·'+it.h+'×'+it.w});x+=it.w;rowH=Math.max(rowH,it.h)}}
  return out;
}
function mkLayout(name,len,width,items){const L={name,len,stock:{w:len,h:width},items};L.util=+(items.reduce((a,i)=>a+i.w*i.h,0)/(len*width)*100).toFixed(1);return L}
const LAYOUTS_2D=[

function buildPlan(R,LS){

    if(typeof p==='object'){blocks.push({kind:'skip',start:pos,len:p.skip});pos+=p.skip;continue}
    const L=LS[p],b={kind:'seg',start:pos,len:L.len,L,li:p,idx:segs.length};blocks.push(b);segs.push(b);pos+=L.len}
  if(pos<R.total)blocks.push({kind:'tail',start:pos,len:R.total-pos});
  const count=LS.map((_,i)=>segs.filter(s=>s.li===i).length);
  return {blocks,segs,count,end:pos};

/* ---------------- 画布（纯渲染：只接收 stock / items） ---------------- */
function renderLayout(L,{w,h,pad=36,labels=true,dims=true,cuts=true,oneD=false}={}){
  const sw=L.stock.w,sh=L.stock.h;
  const s=Math.min((w-pad*2)/sw,(h-pad*2)/sh),ox=(w-sw*s)/2,oy=(h-sh*s)/2;
  let g=`<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--canvas-grid)" stroke-width="1"/></pattern>
  <pattern id="waste" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5a6068" stroke-width="1"/></pattern></defs>`;
  if(pad>20)g+=`<rect width="${w}" height="${h}" fill="url(#grid)"/>`;
  g+=`<rect x="${ox}" y="${oy}" width="${sw*s}" height="${sh*s}" fill="url(#waste)" stroke="#9aa4ae" stroke-width="1"/>`;
  for(const it of L.items){
    const c=ORDER_COLORS[it.o];
    g+=`<rect x="${ox+it.x*s}" y="${oy+it.y*s}" width="${it.w*s}" height="${it.h*s}" fill="${c}" fill-opacity=".82" stroke="#1d2125" stroke-width="${pad>20?1:.5}"/>`;
    if(labels&&it.w*s>46&&it.h*s>14)g+=`<text x="${ox+(it.x+it.w/2)*s}" y="${oy+(it.y+it.h/2)*s+4}" fill="#fff" font-size="11" font-family="var(--mono)" text-anchor="middle">${it.label}</text>`;
  }
  if(cuts&&pad>20){
    if(oneD){const ys=[...new Set(L.items.map(i=>i.y+i.h))];ys.pop();
      for(const y of ys)g+=`<line x1="${ox-10}" x2="${ox+sw*s+10}" y1="${oy+y*s}" y2="${oy+y*s}" stroke="#f0c674" stroke-width="1" stroke-dasharray="5 3"/>`;
      L.items.forEach((it,i)=>g+=`<text x="${ox-14}" y="${oy+(it.y+it.h/2)*s+4}" fill="#9aa4ae" font-size="10" text-anchor="end" font-family="var(--mono)">刀${i+1}</text>`);
    }else{const ys=[...new Set(L.items.map(i=>i.y+i.h))].filter(y=>y<sh);
      for(const y of ys)g+=`<line x1="${ox}" x2="${ox+sw*s}" y1="${oy+y*s}" y2="${oy+y*s}" stroke="#f0c674" stroke-width="1" stroke-dasharray="5 3"/>`}
  }
  if(dims&&pad>20){
    g+=`<text x="${ox+sw*s/2}" y="${oy-12}" fill="#c9d0d7" font-size="11" text-anchor="middle" font-family="var(--mono)">${oneD?'卷长方向 →':sw+' mm'}</text>`;
    g+=`<text x="${ox+sw*s+14}" y="${oy+sh*s/2}" fill="#c9d0d7" font-size="11" font-family="var(--mono)" transform="rotate(90 ${ox+sw*s+14} ${oy+sh*s/2})" text-anchor="middle">${oneD?'门幅 '+sh+' mm':sh+' mm'}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* ---------------- 画布（纯渲染：只接收 母卷 / 方案块 / 当前段） ---------------- */
const SVG_DEFS=`<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--canvas-grid)" stroke-width="1"/></pattern>
<pattern id="waste" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5a6068" stroke-width="1"/></pattern>
<pattern id="usedp" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#2b3036"/><line x1="0" y1="0" x2="0" y2="5" stroke="#454c54" stroke-width="2"/></pattern>
<pattern id="skipp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#3a2a2a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#a04a40" stroke-width="1.5"/></pattern></defs>`;
/* 画一组方案块；toX(d) 把显示坐标映射到像素，k 为该块长度方向压缩比 */
function drawBlocks(blocks,R,s,toX,y0,{cur=-1,dim=false,labels=false,oneD=false}={}){
  let g='';const H=R.width*s;
  for(const b of blocks){
    const x=toX(b.d0),wpx=b.dl*s,k=b.dl/b.len;
    if(b.kind==='used')g+=`<rect x="${x}" y="${y0}" width="${wpx}" height="${H}" fill="url(#usedp)"/>`;
    else if(b.kind==='skip')g+=`<rect x="${x}" y="${y0}" width="${wpx}" height="${H}" fill="url(#skipp)"/>`;
    else if(b.kind==='tail')g+=`<rect x="${x}" y="${y0}" width="${wpx}" height="${H}" fill="#2f353b" stroke="#8a949e" stroke-dasharray="4 3"/>${wpx>60?`<text x="${x+wpx/2}" y="${y0+H/2+4}" fill="#9aa4ae" font-size="11" text-anchor="middle">尾料 ${m(b.len)} m → 料头</text>`:''}`;
    else{
      const on=b.idx===cur, cut=b.idx<R.cutSegs, op=cut?.38:dim&&!on?.28:1;
      g+=`<g opacity="${op}"><rect x="${x}" y="${y0}" width="${wpx}" height="${H}" fill="url(#waste)" stroke="#5d6670"/>`;
      for(const it of b.L.items){
        const iw=it.w*k*s, ih=it.h*s;
        g+=`<rect x="${x+it.x*k*s}" y="${y0+it.y*s}" width="${iw}" height="${ih}" fill="${ORDER_COLORS[it.o]}" fill-opacity=".85" stroke="#1d2125" stroke-width="${s>.05?1:.4}"/>`;
        if(labels&&(VERT?ih:iw)>52&&(VERT?iw:ih)>14)g+=`<text x="${x+(it.x+it.w/2)*k*s}" y="${y0+(it.y+it.h/2)*s+4}" fill="#fff" font-size="11" font-family="var(--mono)" text-anchor="middle">${it.label}</text>`;
      }
      g+=`</g>`;
      if(!oneD||on)g+=`<line x1="${x}" x2="${x}" y1="${y0-3}" y2="${y0+H+3}" stroke="#f0c674" stroke-width="1"/>`;
      if(cut&&wpx>34&&H>24)g+=`<text x="${x+wpx/2}" y="${y0+14}" fill="#e6ebef" font-size="10.5" text-anchor="middle">已切 ✓</text>`;
    }
  }
  return g;
}
function displayBlocks(plan,oneD){
  /* 二维按真实长度；一维每车定长，长度方向只做示意压缩 */
  let d=0;return plan.blocks.filter(b=>!(oneD&&b.kind==='used')).map(b=>{const dl=oneD?(b.kind==='tail'?6000:3000):b.len;const r={...b,d0:d,dl};d+=dl;return r});
}
function defectMarks(R,s,toX,y0){return R.defects.map(d=>`<rect x="${toX(d.pos)}" y="${y0+d.x*s}" width="${Math.max(3,d.len*s)}" height="${Math.max(3,d.w*s)}" fill="${d.fresh?'#ff9f43':'#ff6b5b'}" fill-opacity=".25" stroke="${d.fresh?'#ff9f43':'#ff6b5b'}" stroke-width="1.5"/>`+(d.len*s>20||d.w*s>20?`<text x="${toX(d.pos)+d.len*s+4}" y="${y0+d.x*s+10}" fill="#ffb3aa" font-size="10">${d.desc}</text>`:'')).join('')}

/* 方向只是显示变换：模型坐标不变（X=幅宽，Y=卷长），竖向时整体转置，文字保持正向 */
function orient(svg,vertical){
  if(!vertical)return svg;
  const [,w,h]=svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  let inner=svg.slice(svg.indexOf('>')+1,svg.lastIndexOf('</svg>'));
  inner=inner.replace(/<text( class="(\w+)")? x="([^"]+)" y="([^"]+)"([^>]*)>/g,(all,c,cls,x,y,rest)=>{
    rest=rest.replace(/ transform="[^"]*"/,'');
    const rot=cls==='along'?' rotate(-90)':'';
    return `<text x="${x}" y="${y}" transform="translate(${x} ${y}) matrix(0 1 1 0 0 0)${rot} translate(${-x} ${-y})"${rest}>`;
  }).replace(/→/g,'↓');
  return `<svg viewBox="0 0 ${h} ${w}" preserveAspectRatio="xMidYMid meet"><g transform="matrix(0 1 1 0 0 0)">${inner}</g></svg>`;
}

/* ---------------- 画布引擎：整卷是一个连续世界，工位 / 全卷只是相机预设 ----------------
   渲染空间：长度方向 = x，幅宽方向 = y（竖向时由 orient() 整体转置）。
   相机 cam = {s: 像素/mm, tx, ty}；1 CSS 像素 = 0.2646 mm（96 dpi），据此换算 1:N。 */
let VERT=false;
const PX_MM=0.2646, RULER=22;
const CV={cam:null,drag:null,cursor:null};
function cvWorld(){const oneD=state.wbKind==='1d',R=oneD?ROLL_1D:ROLL_2D,P=oneD?PLAN_1D:PLAN_2D,db=displayBlocks(P,oneD);

function cvSize(){const el=document.getElementById('cvs');if(!el)return null;const r=el.getBoundingClientRect();return VERT?{w:r.height,h:r.width}:{w:r.width,h:r.height}}
function realAt(db,d){for(const b of db)if(d<=b.d0+b.dl)return b.start+Math.max(0,d-b.d0)/b.dl*b.len;const l=db[db.length-1];return l.start+l.len}

function presetCam(){
  const sz=cvSize();if(!sz)return;const W=cvWorld(),{w,h}=sz,Wd=W.R.width;
  const pad={l:RULER+44,r:40,t:RULER+46,b:46};

  else if(state.fullMode==='tile'){
    let best=null;for(let n=1;n<=10;n++){const rl=W.D/n,gap=Wd*.3,c=fitCam(0,rl,0,n*Wd+(n-1)*gap,w,h,{l:58,r:18,t:24,b:16});if(!best||c.s>best.s)best={...c,rows:{n,rowLen:rl,gap}}}
    cam={...best,mode:'tile'}}

function rulerStep(s,min=70){const d=min/s,m=10**Math.floor(Math.log10(d));return [1,2,5,10].find(n=>n*m>=d)*m}
function ratioText(s){const n=1/(s*PX_MM);return '1:'+(n>=10?Math.round(n):n>=1?n.toFixed(1):n.toFixed(2))}

function drawCanvas(){

    g+=`<rect x="${ox}" y="${y0-6}" width="${x1-ox}" height="${H+12}" fill="none" stroke="#7fb3e6" stroke-width="2" stroke-dasharray="6 3"/>`;

function bindCanvas(){
  const el=document.getElementById('cvs');if(!el)return;

/* ---------------- 跑布验疵：验布线固定，布面随位置滚动；坐标以右边缘 / 卷头为基准 ---------------- */
const INSP={roll:'R-2610-0934',mat:'无纺布 2400',width:2400,total:1000000,pos:86.4,step:1,speed:3,run:false,tool:'mark',sel:null,timer:null,drag:null,

function inspView(){const el=document.getElementById('isvg');if(!el)return null;const r=el.getBoundingClientRect();
  const W=INSP.width,pad={l:52,r:24,t:26,b:10},s=(r.width-pad.l-pad.r)/W,lineY=r.height*0.62,y0=INSP.pos*1000-(lineY-pad.t)/s;

function drawInsp(){
  const v=inspView();if(!v)return;const {r,s,pad,lineY,y0,ox,W}=v,I=INSP,sx=x=>ox+(W-x)*s,sy=y=>pad.t+(y-y0)*s,y1=y0+(r.height-pad.t)/s;

  g+=`<rect x="${ox}" y="${Math.max(pad.t,sy(0))}" width="${W*s}" height="${r.height}" fill="#3a4148" stroke="#6b747e"/>`;
  g+=`<rect x="${ox}" y="${pad.t}" width="${W*s}" height="${Math.max(0,lineY-pad.t)}" fill="#ffffff" fill-opacity=".04"/>`;
  I.defects.forEach((d,i)=>{if(d.y+d.h<y0||d.y>y1)return;const L=sx(d.x+d.w),T=sy(d.y),mg=d.margin*s;
    g+=`<rect x="${L-mg}" y="${T-mg}" width="${d.w*s+2*mg}" height="${d.h*s+2*mg}" fill="none" stroke="#ff6b5b" stroke-opacity=".45" stroke-dasharray="3 3"/>`;
    g+=`<rect x="${L}" y="${T}" width="${d.w*s}" height="${d.h*s}" fill="#ff6b5b" fill-opacity="${d.saved?.25:.45}" stroke="${I.sel===i?'#fff':'#ff6b5b'}" stroke-width="${I.sel===i?2:1.2}"/>`;
    g+=`<text x="${L+d.w*s+5}" y="${T+10}" fill="#ffb3aa" font-size="10.5">${d.type} ${d.w}×${d.h}</text>`;
    if(I.sel===i&&!d.saved)[[L,T],[L+d.w*s,T],[L,T+d.h*s],[L+d.w*s,T+d.h*s]].forEach(([a,b])=>g+=`<rect x="${a-3}" y="${b-3}" width="6" height="6" fill="#fff"/>`)});
  if(I.drag&&I.tool==='mark'){const a=I.drag.a,b=I.drag.b;g+=`<rect x="${Math.min(a[0],b[0])}" y="${Math.min(a[1],b[1])}" width="${Math.abs(a[0]-b[0])}" height="${Math.abs(a[1]-b[1])}" fill="#ff6b5b" fill-opacity=".25" stroke="#ff6b5b" stroke-dasharray="4 2"/>`}
  /* 验布线：横向刻度 = 距右边缘 mm */
  g+=`<line x1="${ox-8}" x2="${ox+W*s+8}" y1="${lineY}" y2="${lineY}" stroke="#4cc38a" stroke-width="2"/>`;
  for(let x=0;x<=W;x+=200){const X=sx(x);g+=`<line x1="${X}" x2="${X}" y1="${lineY-(x%1000?4:8)}" y2="${lineY}" stroke="#4cc38a"/>${x%400?'':`<text x="${X}" y="${lineY-11}" fill="#8fe0b5" font-size="9.5" text-anchor="middle" font-family="var(--mono)">${x}</text>`}`}
  g+=`<rect x="${ox+W*s-2}" y="${lineY+4}" width="78" height="18" fill="#1d2125"/><text x="${ox+W*s+3}" y="${lineY+17}" fill="#8fe0b5" font-size="11.5" font-family="var(--mono)">${I.pos.toFixed(2)} m</text>`;
  /* 左侧纵向刻度 = 距卷头 m；顶部刻度 = 距右边缘 mm */
  g+=`<rect x="0" y="0" width="${pad.l-8}" height="${r.height}" fill="#23272c"/>`;
  const st=rulerStep(s,60);for(let y=Math.ceil(y0/st)*st;y<y1;y+=st){const Y=sy(y);g+=`<line x1="${pad.l-16}" x2="${pad.l-8}" y1="${Y}" y2="${Y}" stroke="#6b747e"/><text x="${pad.l-18}" y="${Y+3}" fill="#9aa4ae" font-size="9.5" text-anchor="end" font-family="var(--mono)">${(y/1000).toFixed(st<1000?1:0)}</text>`}
  g+=`<rect x="${pad.l-8}" y="0" width="${r.width}" height="${pad.t-4}" fill="#23272c"/>`;
  for(let x=0;x<=W;x+=400){const X=sx(x);g+=`<text x="${X}" y="${pad.t-9}" fill="#9aa4ae" font-size="9.5" text-anchor="middle" font-family="var(--mono)">${x}</text>`}

function inspModel(px,py){const v=inspView(),y=v.y0+(py-v.pad.t)/v.s,x=v.W-(px-v.ox)/v.s;return [x,y]}
function bindInsp(){

function renderTrack(R,plan,cur,oneD){
  const pct=v=>(v/R.total*100).toFixed(3)+'%';
  let t='';
  for(const b of plan.blocks){
    const st=`left:${pct(b.start)};width:${pct(b.len)}`;
    if(b.kind==='seg'){const cut=b.idx<R.cutSegs;t+=`<div class="tb seg ${cut?'cut':''}" style="${st};background:${LAYOUT_TINT[b.li]}" title="${b.L.name} · Y ${m(b.start)}–${m(b.start+b.len)} m${cut?' · 已切（固定）':''}" onclick="pickSeg(${b.idx})"></div>`}
    else t+=`<div class="tb ${b.kind}" style="${st}" title="${{used:'已用',skip:'疵点避让',tail:'尾料'}[b.kind]} ${m(b.len)} m"></div>`;
  }
  const wn=getWin(),wcut=wn.start<cutEnd(R,plan)-1;
  t+=`<div class="twin ${wcut?'ro':''}" id="twin" style="left:${pct(wn.start)};width:${pct(wn.len)}" title="${wcut?'已切段（只读查看）':'拖动移动工位，吸附拉布段边界'}"><span class="twl">${wcut?'已切 · ':''}工位 ${m(wn.start)}–${m(wn.start+wn.len)} m${oneD?'':' · 拉布 '+wn.len+' mm'}</span>${oneD||wcut?'':'<div class="twh" id="twh" title="拖动调整拉布长度">Ⅱ</div>'}</div>`;
  for(const d of R.defects)t+=`<div class="tdef" style="left:${pct(d.pos)}" title="疵点 ${d.desc} · Y ${m(d.pos)} m"></div>`;
  for(let p=0;p<=R.total;p+=R.tick)t+=`<div class="ttick" style="left:${pct(p)}">${m(p)}</div>`;
  const used=R.used, planLen=plan.end-R.used, skip=plan.blocks.filter(b=>b.kind==='skip').reduce((a,b)=>a+b.len,0), tail=R.total-plan.end;
  const chips=(oneD?LAYOUTS_1D:LAYOUTS_2D).map((L,i)=>`<button class="chip" onclick="pickSeg(${plan.segs.findIndex(s=>s.li===i)})"><i style="background:${LAYOUT_TINT[i]}"></i>${L.name}${oneD?'':' · '+m(L.len)+' m'} <b>×${plan.count[i]}</b></button>`).join('');
  return `<div class="nr-head"><span>母卷 <b class="num">${R.id}</b></span><span>幅宽 <b class="num">${R.width}</b> mm</span><span>总长 <b class="num">${m(R.total)}</b> m</span><span>已用 <b class="num">${m(used)}</b> m</span><span>已切 <b class="num">${R.cutSegs}</b> ${oneD?'车':'次'}（固定）</span><span>本方案 <b class="num">${plan.segs.length}</b> ${oneD?'车':'次拉布'} · <b class="num">${m(planLen)}</b> m</span>${skip?`<span>避让 <b class="num" style="color:#ff8a7a">${m(skip)}</b> m</span>`:''}<span>尾料 <b class="num">${m(tail)}</b> m</span></div>
  <div class="nr-track">${t}</div><div class="nr-chips">${chips}</div>`;
}

function render(){
  if(!PAGES[state.page])state.page='tasks';
  nav();
  document.getElementById('main').innerHTML=PAGES[state.page]();
  VERT=state.orient==='v';
  if(state.page==='workbench'){drawCanvas();bindCanvas();bindTrack()}
  if(state.page==='inspection')bindInsp();
  status(state.page==='workbench'?`<span>光标 <span id="cursorpos" class="num">—</span></span><span>工位 Y <span class="num">${m(getWin().start)}–${m(getWin().start+getWin().len)}</span> m</span><span>引擎 ${state.wbKind==='1d'?'一维内核':'PackingSolver'}</span>`:'');
}
function go(p,kind){if(kind)state.wbKind=kind;state.seg=curRoll().cutSegs;state.win=null;CV.cam=null;state.page=p;try{history.replaceState(null,'','#'+p)}catch(e){}render()}
function setKind(k){state.wbKind=k;state.seg=curRoll().cutSegs;state.win=null;CV.cam=null;render()}
function pickSeg(i){const n=(state.wbKind==='1d'?PLAN_1D:PLAN_2D).segs.length;state.seg=Math.max(0,Math.min(n-1,i));state.win=null;if(state.view==='station')CV.cam=null;render()}
function setWinLen(v){const R=curRoll(),w=getWin();v=Math.round(+v);if(!(v>0))return render();state.win={start:w.start,len:Math.max(R.bedMin,Math.min(R.bedMax,v))};CV.cam=null;render()}
function bindTrack(){
  const tw=document.getElementById('twin');if(!tw||tw.classList.contains('ro'))return;
  const track=tw.parentElement;
  tw.onmousedown=e=>{
    const resize=e.target.id==='twh',R=curRoll(),P=curPlan(),oneD=state.wbKind==='1d',x0=e.clientX,w0={...getWin()},mmPx=R.total/track.getBoundingClientRect().width,lo=cutEnd(R,P);
    const snaps=[lo,...P.segs.filter(s=>s.idx>=R.cutSegs).map(s=>s.start)],thr=12*mmPx;
    e.preventDefault();e.stopPropagation();
    const mv=ev=>{
      const dmm=(ev.clientX-x0)*mmPx;
      if(resize){state.win={start:w0.start,len:Math.round(Math.max(R.bedMin,Math.min(R.bedMax,w0.len+dmm))/100)*100}}
      else{let st=Math.max(lo,Math.min(R.total-w0.len,w0.start+dmm));const sn=snaps.reduce((a,b)=>Math.abs(b-st)<Math.abs(a-st)?b:a,snaps[0]);
        if(oneD||Math.abs(sn-st)<thr)st=sn;else st=Math.round(st/100)*100;
        const i=segAt(P,st);const aligned=i>=0&&Math.abs(P.segs[i].start-st)<1;
        if(aligned){state.seg=i;state.win=oneD?null:{start:st,len:w0.len}}else state.win={start:st,len:w0.len}}
      CV.cam=null;render();
    };
    const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up)};
    window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
  };
}
function togglePop(k,e){e.stopPropagation();state.pop=state.pop===k?null:k;render()}
document.addEventListener('click',()=>{if(state.pop){state.pop=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.pop){state.pop=null;render()}});
function setTool(t){state.tool=t;if(t!=='measure')CV.meas=null;render()}
function setView(v){state.view=v;CV.cam=null;render()}
function setFullMode(v){state.fullMode=v;CV.cam=null;render()}
function setOrient(o){state.orient=o;VERT=o==='v';CV.cam=null;render()}
function matTab(t){state.matTab=t;state.matSel=0;render()}
function matSel(i){state.matSel=i;render()}
state.page=(location.hash.slice(1)||'tasks');
render();
</script>
