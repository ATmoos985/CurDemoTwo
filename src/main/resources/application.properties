spring.application.name=CutDemoTwo
server.port=8080

# PackingSolver C++ 可执行文件路径
packingsolver.executable.path=d:/GitLab/packingsolver/build/src/rectangleguillotine/packingsolver_rectangleguillotine.exe

spring.jackson.deserialization.fail-on-null-for-primitives=false

# 强制 Servlet 请求与响应采用 UTF-8 编码，防止中文裁片名称乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# 禁用前端静态资源强缓存，防止浏览器保留旧 JS 引起加载异常
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

