spring.application.name=CutDemoTwo
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# PackingSolver C++ 可执行文件路径
packingsolver.executable.path=${PACKINGSOLVER_PATH:data/solver/packingsolver_rectangleguillotine.exe}
packingsolver.irregular.executable.path=${PACKINGSOLVER_IRREGULAR_PATH:data/solver/packingsolver_irregular.exe}
# 原生直刀引擎缺失时改用内置 javaguillotine 求解；结果会标注实际引擎与降级原因。设为 false 则直接返回 UNAVAILABLE
packingsolver.fallback.enabled=${PACKINGSOLVER_FALLBACK_ENABLED:true}

spring.jackson.deserialization.fail-on-null-for-primitives=false

# 强制 Servlet 请求与响应采用 UTF-8 编码，防止中文裁片名称乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# 禁用前端静态资源强缓存，防止浏览器保留旧 JS 引起加载异常
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# 多线程并发求解池配置（支持多策略并行竞速）
cutdemo.jobs.workers=${CUTDEMO_JOBS_WORKERS:6}
cutdemo.jobs.queue-capacity=${CUTDEMO_JOBS_QUEUE_CAPACITY:32}

# 优雅停机：等待正在执行的请求在时限内收尾再退出
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# 可观测性：暴露健康探针、应用信息与 Prometheus 指标端点
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# 轻量企业认证与安全边界（默认关闭以保持单机平滑兼容，生产可按需开启）
cutdemo.auth.enabled=${CUTDEMO_AUTH_ENABLED:false}
cutdemo.auth.secret=${CUTDEMO_AUTH_SECRET:}
cutdemo.auth.token-ttl-hours=${CUTDEMO_AUTH_TOKEN_TTL_HOURS:12}
cutdemo.auth.users=${CUTDEMO_AUTH_USERS:}
cutdemo.security.max-request-body-bytes=${CUTDEMO_SECURITY_MAX_REQUEST_BODY_BYTES:2097152}
cutdemo.security.write-rate-limit-per-minute=${CUTDEMO_SECURITY_WRITE_RATE_LIMIT_PER_MINUTE:600}



