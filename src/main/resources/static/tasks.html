<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>任务管理 · 布料裁切</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/product-navigation.css"><link rel="stylesheet" href="css/management.css"></head>
<body class="management-page">
<header><a class="brand" href="/tasks.html">布料裁切 <span>任务管理</span></a><div data-product-nav="tasks"></div></header>
<main>
<div class="management-heading"><div><h1>生产任务</h1><p>从需求、方案到执行报工。合格报工计入完成，预约单独显示。</p></div><a class="action-primary" href="/index.html?newTask=1">新建裁切任务</a></div>
<nav class="management-tabs" aria-label="任务范围"><a href="/tasks.html" aria-current="page">二维生产任务</a><a href="/linear.html">一维分切作业</a></nav>
<p class="scope-note">当前列表为已保存的二维生产任务，包含矩形与服装轮廓。旧一维分切作业尚未接入同一执行与库存账。</p>
<form class="management-filters" id="task-filters"><label>查找任务<input id="task-search" type="search" placeholder="任务号、名称、材料或来源单号"></label><label>状态<select id="task-status"><option value="all">全部状态</option><option value="PLAN_PENDING">待排料</option><option value="EXECUTION_PENDING">待执行</option><option value="REPORT_PENDING">待报工</option><option value="ATTENTION">需处理</option><option value="COMPLETED">已完成</option></select></label><button type="button" id="refresh-tasks">刷新</button><span id="task-list-summary" role="status"></span></form>
<p id="task-list-error" role="alert" hidden></p>
<div class="management-table-wrap"><table><caption class="sr-only">生产任务与履约、预约状态</caption><thead><tr><th scope="col">任务 / 来源</th><th scope="col">材料型号</th><th scope="col">状态</th><th scope="col">净良品 / 需求</th><th scope="col">预约 / 可排量</th><th scope="col">材料占用</th><th scope="col">下一步</th></tr></thead><tbody id="task-rows"></tbody></table></div>
<p id="task-list-empty" hidden>没有符合条件的任务。可以调整筛选，或新建任务录入需求。</p>
<footer class="management-help"><a href="/index.html">返回当前工作台与本机草稿</a><span>预览不扣库存；可排量 = 需求 − 净良品 − 有效预约。本机暂存尚未计入服务器预约。</span></footer>
</main>
<script type="module" src="js/product-navigation.js"></script><script type="module" src="js/business/cutting/task-list.js"></script>
</body></html>
