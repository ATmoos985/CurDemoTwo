cutdemo.storage=mysql
cutdemo.seed-demo-data=false
cutdemo.database.url=${CUTDEMO_DB_URL:jdbc:mysql://localhost:3306/cutdemo?characterEncoding=UTF-8&connectionTimeZone=Asia/Taipei}
cutdemo.database.username=${CUTDEMO_DB_USER:cutdemo}
cutdemo.database.password=${CUTDEMO_DB_PASSWORD}
# 云端低配容器（2 GiB 宿主机 / 768 MiB 容器）默认收口并发池与一维子进程堆上限，仍支持环境变量覆盖
cutdemo.jobs.workers=${CUTDEMO_JOBS_WORKERS:2}
cutdemo.jobs.queue-capacity=${CUTDEMO_JOBS_QUEUE_CAPACITY:16}
cutdemo.jobs.storage=${CUTDEMO_JOBS_STORAGE:mysql}
cutdemo.jobs.terminal-retention-hours=${CUTDEMO_JOBS_TERMINAL_RETENTION_HOURS:168}
cutdemo.slitting.child-xmx=${CUTDEMO_SLITTING_CHILD_XMX:384m}
cutdemo.slitting.max-idle-workers=${CUTDEMO_SLITTING_MAX_IDLE_WORKERS:1}
cutdemo.slitting.idle-ttl-seconds=${CUTDEMO_SLITTING_IDLE_TTL_SECONDS:120}
cutdemo.slitting.max-active-workers=${CUTDEMO_SLITTING_MAX_ACTIVE_WORKERS:1}
packingsolver.memory-limit-mb=${PACKINGSOLVER_MEMORY_LIMIT_MB:256}
packingsolver.irregular.memory-limit-mb=${PACKINGSOLVER_IRREGULAR_MEMORY_LIMIT_MB:256}

# 生产 MySQL 环境安全收口：默认关闭演示重置入口并强制校验 MES 令牌
cutdemo.demo.endpoints-enabled=${CUTDEMO_DEMO_ENDPOINTS_ENABLED:false}
cutdemo.mes.auth-required=${CUTDEMO_MES_AUTH_REQUIRED:true}
cutdemo.mes.token=${CUTDEMO_MES_TOKEN:}

