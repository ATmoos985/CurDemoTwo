name: Verify and publish image
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mysql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start MySQL 8.4 with production utf8mb4_bin collation
        run: |
          set -euo pipefail
          docker run -d --name cutdemo-mysql-ci \
            -p 127.0.0.1:13306:3306 \
            -e MYSQL_ROOT_PASSWORD=cutdemo_ci_root_pw \
            mysql:8.4 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_bin \
            --default-storage-engine=InnoDB
          for i in $(seq 1 60); do
            if docker exec cutdemo-mysql-ci mysqladmin ping -h 127.0.0.1 -uroot -pcutdemo_ci_root_pw --silent; then
              break
            fi
            sleep 2
          done
          docker exec cutdemo-mysql-ci mysql -h 127.0.0.1 -uroot -pcutdemo_ci_root_pw \
            -e "SELECT VERSION(), @@character_set_server, @@collation_server;"
      - name: Run JDBC and Flyway tests against MySQL 8.4
        run: |
          ./mvnw -B test \
            -Dcutdemo.test.mysql.url=jdbc:mysql://127.0.0.1:13306/ \
            -Dcutdemo.test.mysql.user=root \
            -Dcutdemo.test.mysql.password=cutdemo_ci_root_pw \
            -Dgroups=mysql-integration
      - name: Cleanup MySQL 8.4 container
        if: always()
        run: |
          if [[ "${{ job.status }}" != "success" ]]; then
            docker logs --tail 100 cutdemo-mysql-ci || true
          fi
          docker rm -f cutdemo-mysql-ci || true

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify restricted deployment command
        run: bash src/test/deploy/actions-ssh-command.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run workflow closure, architecture & outbox worker gates
        run: |
          node --test integrations/inventory/test/sync-worker.test.mjs
          node --test benchmark/*.test.mjs
          node --test scripts/arch-coupling-audit.test.mjs
          node scripts/arch-coupling-audit.mjs --fail-on-cycle
          node --test scripts/workflow-closure-audit.test.mjs
          node scripts/workflow-closure-audit.mjs --fail
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare immutable image tag
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          registry_image="ghcr.io/${REPOSITORY,,}"
          printf 'image=%s\n' "$registry_image" >> "$GITHUB_OUTPUT"
          printf 'tag=%s:git-%s\n' "$registry_image" "$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Build Linux solver, execute full test gates and publish image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: REQUIRE_NATIVE_SOLVERS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published immutable digest
        id: publish
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf '::error::Unexpected image digest output: %s\n' "$DIGEST"
            exit 1
          fi
          full_digest="${IMAGE}@${DIGEST}"
          printf 'digest=%s\n' "$full_digest" >> "$GITHUB_OUTPUT"
          printf 'Verified image: `%s`\n\nDeploy using the Deploy workflow and this digest.\n' "$full_digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [image, mysql-integration]
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.image.outputs.digest }}
    secrets: inherit
